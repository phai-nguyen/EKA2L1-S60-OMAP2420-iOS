name: Build EKA2L1 S60 OMAP2420 iOS15 Base

on:
  push:
    branches:
      - n95-rm159
    paths:
      - ".github/workflows/build-ios15-omap2420.yml"
      - "patches/code/**"
      - "patches/**/*.patch"
      - "patches/**/*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eka2l1-omap2420-ios15-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-vi:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      EKA2L1_IOS_CONFIGURATION: Release
      EKA2L1_IOS_DEPLOYMENT_TARGET: "15.0"
      # iOS 18.7 can kill a sideloaded app while the upstream JIT probe executes a generated page.
      # Localization test builds use the interpreter so the app can always reach the UI.
      EKA2L1_IOS_DYNARMIC: OFF
      EKA2L1_UPSTREAM_COMMIT: 3afd85d249f4eef16071f6fdbbbf44e49e4072f7
      # Must match the provisioning App ID suffix used by the current ESign profile.
      EKA2L1_ESIGN_BUNDLE_ID: app.lavender1865.valley8348

    steps:
      - name: Checkout Vietnamese localization branch
        id: checkout
        uses: actions/checkout@v7

      - name: Clone official EKA2L1 source
        id: clone
        run: |
          set -euo pipefail
          git init upstream
          cd upstream
          git remote add origin https://github.com/EKA2L1/EKA2L1.git
          git -c protocol.version=2 fetch --depth 1 origin "$EKA2L1_UPSTREAM_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$EKA2L1_UPSTREAM_COMMIT"
          git submodule update --init --recursive --depth 1 --jobs 8

      - name: Apply iOS 15 compatibility layer
        id: ios15
        run: |
          set -euo pipefail
          python3 patches/code/apply-ios15-compat.py upstream

      - name: Apply persistent diagnostic logs
        id: logpack
        run: |
          set -euo pipefail
          python3 patches/code/apply-ios-diagnostic-logs.py upstream
          grep -q 'N95OMAP-LOGPACK1' upstream/src/emu/common/src/log.cpp
          grep -q 'EKA2L1_Persistent.log' upstream/src/emu/common/src/log.cpp
          grep -q 'EKA2L1_Persistent-prev.log' upstream/src/emu/common/src/log.cpp

      - name: Apply N95 OMAP2420 PROBE1
        id: probe1
        run: |
          set -euo pipefail
          python3 patches/code/apply-n95-omap2420-probe1.py upstream
          grep -q 'N95OMAP-PROBE1' upstream/src/emu/kernel/src/kernel.cpp

      - name: Restore incremental Xcode build
        uses: actions/cache@v6
        with:
          path: upstream/build/ios-device
          key: eka2l1-ios-build-${{ runner.os }}-ios${{ env.EKA2L1_IOS_DEPLOYMENT_TARGET }}-${{ env.EKA2L1_UPSTREAM_COMMIT }}-${{ github.sha }}
          restore-keys: |
            eka2l1-ios-build-${{ runner.os }}-ios${{ env.EKA2L1_IOS_DEPLOYMENT_TARGET }}-${{ env.EKA2L1_UPSTREAM_COMMIT }}-

      - name: Apply Vietnamese string catalogs
        run: |
          set -euo pipefail
          cp patches/Localizable.xcstrings upstream/src/emu/ios/Resources/Localizable.xcstrings
          cp patches/InfoPlist.xcstrings upstream/src/emu/ios/Resources/InfoPlist.xcstrings


      - name: Cache iOS FFmpeg
        uses: actions/cache@v6
        with:
          path: upstream/src/external/ffmpeg/ios/device
          key: ffmpeg-ios-device-vi-ios${{ env.EKA2L1_IOS_DEPLOYMENT_TARGET }}-${{ env.EKA2L1_UPSTREAM_COMMIT }}

      - name: Build unsigned iPhone app
        id: build
        working-directory: upstream
        run: |
          set -o pipefail
          mkdir -p ../diagnostics
          ./scripts/build_ios.sh device 2>&1 | tee ../diagnostics/build-ios.log

      - name: Verify iOS 15 deployment target
        id: verify_target
        run: |
          set -euo pipefail
          APP="upstream/build/ios-device/src/emu/ios/${EKA2L1_IOS_CONFIGURATION}-iphoneos/EKA2L1.app"
          minimum=$(/usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist")
          echo "MinimumOSVersion=$minimum"
          test "$minimum" = "15.0"

      - name: Verify Vietnamese resources
        id: verify_vi
        run: |
          set -euo pipefail
          APP="upstream/build/ios-device/src/emu/ios/${EKA2L1_IOS_CONFIGURATION}-iphoneos/EKA2L1.app"
          test -d "$APP"
          test -f "$APP/vi.lproj/Localizable.strings"
          test -f "$APP/vi.lproj/InfoPlist.strings"
          echo "Vietnamese resources are present in the app bundle."
          /usr/bin/plutil -p "$APP/vi.lproj/Localizable.strings" | head -40

      - name: Stage reusable base app
        run: |
          set -euo pipefail
          APP="upstream/build/ios-device/src/emu/ios/${EKA2L1_IOS_CONFIGURATION}-iphoneos/EKA2L1.app"
          rm -rf base-app
          mkdir -p base-app
          cp -R "$APP" base-app/EKA2L1.app
          rm -rf base-app/EKA2L1.app/_CodeSignature

      - name: Seed reusable base app cache
        uses: actions/cache@v6
        with:
          path: base-app
          key: eka2l1-ios-base-${{ runner.os }}-ios${{ env.EKA2L1_IOS_DEPLOYMENT_TARGET }}-${{ env.EKA2L1_UPSTREAM_COMMIT }}-${{ hashFiles('.github/workflows/build-ios15-omap2420.yml', 'patches/code/**', 'patches/**/*.patch', 'patches/**/*.py') }}

      - name: Package unsigned IPAs
        id: package
        run: |
          set -euo pipefail
          APP="upstream/build/ios-device/src/emu/ios/${EKA2L1_IOS_CONFIGURATION}-iphoneos/EKA2L1.app"

          rm -rf ipa-vanilla ipa-esign
          rm -f EKA2L1-iOS-Vietnamese-unsigned.ipa EKA2L1-iOS-Vietnamese-ESignMatch-unsigned.ipa

          # Vanilla artifact: keeps upstream com.eka2l1.emulator.
          mkdir -p ipa-vanilla/Payload
          cp -R "$APP" ipa-vanilla/Payload/EKA2L1.app
          rm -rf ipa-vanilla/Payload/EKA2L1.app/_CodeSignature
          (cd ipa-vanilla && /usr/bin/zip -qry ../EKA2L1-iOS-Vietnamese-unsigned.ipa Payload)

          # ESign-match artifact: CFBundleIdentifier is preset to the provisioning
          # App ID suffix that was confirmed on-device to restore Files selection.
          mkdir -p ipa-esign/Payload
          cp -R "$APP" ipa-esign/Payload/EKA2L1.app
          rm -rf ipa-esign/Payload/EKA2L1.app/_CodeSignature
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $EKA2L1_ESIGN_BUNDLE_ID"             ipa-esign/Payload/EKA2L1.app/Info.plist
          actual=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier"             ipa-esign/Payload/EKA2L1.app/Info.plist)
          test "$actual" = "$EKA2L1_ESIGN_BUNDLE_ID"
          (cd ipa-esign && /usr/bin/zip -qry ../EKA2L1-iOS-Vietnamese-ESignMatch-unsigned.ipa Payload)

          ls -lh EKA2L1-iOS-Vietnamese-unsigned.ipa                  EKA2L1-iOS-Vietnamese-ESignMatch-unsigned.ipa

      - name: Generate build status diagnostics
        if: always()
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          CLONE_OUTCOME: ${{ steps.clone.outcome }}
          IOS15_OUTCOME: ${{ steps.ios15.outcome }}
          LOGPACK_OUTCOME: ${{ steps.logpack.outcome }}
          PROBE1_OUTCOME: ${{ steps.probe1.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_TARGET_OUTCOME: ${{ steps.verify_target.outcome }}
          VERIFY_VI_OUTCOME: ${{ steps.verify_vi.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          set +e
          mkdir -p diagnostics

          {
            echo "EKA2L1 N95 OMAP2420 iOS BUILD STATUS"
            echo "timestamp_utc=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_os=${RUNNER_OS}"
            echo "upstream_commit=${EKA2L1_UPSTREAM_COMMIT}"
            echo "ios_deployment_target=${EKA2L1_IOS_DEPLOYMENT_TARGET}"
            echo
            echo "[STEP OUTCOMES]"
            echo "checkout=${CHECKOUT_OUTCOME}"
            echo "clone_upstream=${CLONE_OUTCOME}"
            echo "ios15_compat=${IOS15_OUTCOME}"
            echo "diagnostic_log_pack=${LOGPACK_OUTCOME}"
            echo "n95_probe1=${PROBE1_OUTCOME}"
            echo "build_unsigned_app=${BUILD_OUTCOME}"
            echo "verify_ios15=${VERIFY_TARGET_OUTCOME}"
            echo "verify_vietnamese=${VERIFY_VI_OUTCOME}"
            echo "package_ipa=${PACKAGE_OUTCOME}"
          } > diagnostics/BUILD-STATUS.txt

          if [ -f diagnostics/build-ios.log ]; then
            grep -Ei '(^|[^a-z])(fatal error:|error:|undefined symbols|linker command failed|BUILD FAILED|CMake Error|ninja: build stopped|Process completed with exit code)' diagnostics/build-ios.log               | tail -n 250 > diagnostics/BUILD-ERRORS.txt || true
            tail -n 400 diagnostics/build-ios.log > diagnostics/BUILD-TAIL.txt || true
          else
            {
              echo "No build-ios.log was created."
              echo "The workflow failed or was cancelled before the compiler build step."
              echo "See BUILD-STATUS.txt for the last completed setup stage."
            } > diagnostics/BUILD-ERRORS.txt
          fi

          {
            echo "## N95 OMAP2420 build status"
            echo
            echo "| Stage | Outcome |"
            echo "|---|---|"
            echo "| Checkout | ${CHECKOUT_OUTCOME} |"
            echo "| Clone upstream | ${CLONE_OUTCOME} |"
            echo "| iOS 15 compatibility | ${IOS15_OUTCOME} |"
            echo "| Diagnostic log pack | ${LOGPACK_OUTCOME} |"
            echo "| N95 PROBE1 | ${PROBE1_OUTCOME} |"
            echo "| Build app | ${BUILD_OUTCOME} |"
            echo "| Verify iOS 15 | ${VERIFY_TARGET_OUTCOME} |"
            echo "| Verify Vietnamese | ${VERIFY_VI_OUTCOME} |"
            echo "| Package IPA | ${PACKAGE_OUTCOME} |"
            echo
            echo "Diagnostic artifact: **EKA2L1-N95-OMAP2420-BUILD-STATUS**"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload build status diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: EKA2L1-N95-OMAP2420-BUILD-STATUS
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Vietnamese vanilla IPA
        uses: actions/upload-artifact@v7
        with:
          name: EKA2L1-iOS-Vietnamese-IPA
          path: EKA2L1-iOS-Vietnamese-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Vietnamese ESign-match IPA
        uses: actions/upload-artifact@v7
        with:
          name: EKA2L1-iOS-Vietnamese-ESignMatch-IPA
          path: EKA2L1-iOS-Vietnamese-ESignMatch-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
